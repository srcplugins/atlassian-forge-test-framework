name: Check

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    # A push checks every branch here, and its result shows on that branch's pull request, so
    # pull_request only checks a fork's branch (which pushes nothing here).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    # The self-hosted px-0 runners while the repository is private; GitHub-hosted once it is
    # public, so code from fork pull requests never runs on them.
    runs-on: ${{ github.event.repository.private && 'px-0' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run check
